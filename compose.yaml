services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financetracker
      POSTGRES_USER: financetracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes:
      - finance_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financetracker -d financetracker"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/financetracker
      DB_USER: financetracker
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-configure-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-configure-google-client-secret}
      APP_BASE_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      REMINDERS_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: finance@localhost
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
volumes:
  finance_data:
